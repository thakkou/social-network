version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - sn-data:/app/pkg/db
    networks:
      - sn-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GO_BACKEND_URL=http://backend:8080
      - AUTH_SECRET=change-this-to-a-random-secret-in-production
      - SKIP_ENV_VALIDATION=1
    depends_on:
      - backend
    networks:
      - sn-network

volumes:
  sn-data:

networks:
  sn-network:
    driver: bridge
