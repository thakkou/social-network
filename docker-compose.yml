# version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - sn-data:/app/pkg/db
      - sn-uploads:/app/uploads
    networks:
      - sn-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment: # either use this or env file
      - NODE_ENV=production
      - GO_BACKEND_URL=http://backend:8080 # no need
      - NEXT_PUBLIC_GO_BACKEND_URL=http://localhost:8080 # ?!
      - AUTH_URL=http://localhost:3000 # or NEXTAUTH_URL for nextauth version < 5
      # - AUTH_SECRET=${AUTH_SECRET}
      - SKIP_ENV_VALIDATION=1
    env_file:
      - frontend/.env
    depends_on:
      - backend
    networks:
      - sn-network

volumes:
  sn-data:
  sn-uploads:

networks:
  sn-network:
    driver: bridge
