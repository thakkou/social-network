            additionalProperties: true
            type: object
        "400":
          description: Invalid group ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get group content feed
      tags:
      - Groups
  /api/groups/create:
    post:
      consumes:
