host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://example.com/support
  description: A social network API built with Go. Supports user authentication, posts,
    comments, reactions, groups, messaging, notifications, and real-time WebSocket
    events.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://example.com/terms
  title: Social Network API
  version: "1.0"
paths:
  /api/categories:
    get:
      description: Returns a list of all available post categories.
      produces:
      - application/json
      responses:
        "200":
          description: Categories fetched
          schema:
            items:
              type: string
            type: array
      summary: Get all categories
      tags:
      - Categories
  /api/comments/{id}/delete:
    delete:
      description: Handles like/dislike on comments and comment deletion.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Comment operations
      tags:
      - Comments
  /api/comments/{id}/dislike:
    post:
      description: Handles like/dislike on comments and comment deletion.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Comment operations
      tags:
      - Comments
  /api/comments/{id}/like:
    post:
      description: Handles like/dislike on comments and comment deletion.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Comment operations
      tags:
      - Comments
  /api/comments/create:
    post:
      consumes:
      - application/json
      description: Adds a comment to a post. Accepts JSON or multipart/form-data with
        optional image.
      parameters:
      - description: Post ID (for JSON requests)
        in: body
        name: postId
        schema:
          type: integer
      - description: Comment text
        in: body
        name: text
        schema:
          type: string
      - description: Post ID (for multipart requests)
        in: formData
        name: postId
        type: integer
      - description: Comment body
        in: formData
        name: text
        type: string
      - description: Optional comment image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Comment created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a comment
      tags:
      - Comments
  /api/conversation/{type}/{id}:
    get:
      description: Returns paginated messages for a direct or group conversation.
      parameters:
      - description: 'Conversation type: direct or group'
        enum:
        - direct
        - group
        in: path
        name: type
        required: true
        type: string
      - description: Conversation ID or Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Number of messages (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Messages fetched
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get conversation messages
      tags:
      - Conversations
  /api/conversations:
    get:
      description: Returns the list of conversations (direct and group) for the logged-in
        user.
      parameters:
      - description: Pagination offset
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Number of items (max 30)
        in: query
        maximum: 30
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Conversation feed with direct and group items
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get conversation feed
      tags:
      - Conversations
  /api/follow/{resolver}/{id}:
    put:
      description: Follow, unfollow, accept follow request, or reject follow request.
      parameters:
      - description: 'Action: follow, unfollow, accept, or reject'
        enum:
        - follow
        - unfollow
        - accept
        - reject
        in: path
        name: resolver
        required: true
        type: string
      - description: Target user ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Action successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not logged in
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Follow operations
      tags:
      - Follow
  /api/groups:
    get:
      description: Returns a list of all groups.
